# Static aarch64 build for the Raspberry Pi. musl ships its own C runtime and
# this project has no C dependencies, so Rust's bundled lld can link it:
# no cross toolchain, Docker or zig needed, and no glibc version mismatch
# with Raspberry Pi OS.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# Database tests (sqlx::test) create a throwaway database per test on this
# server, so the user running `cargo test` needs CREATEDB on a local
# PostgreSQL. An exported DATABASE_URL takes precedence.
[env]
DATABASE_URL = "postgres:///postgres?host=/var/run/postgresql"
