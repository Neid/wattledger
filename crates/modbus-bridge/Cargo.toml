[package]
name = "modbus-bridge"
version = "0.1.0"
description = "Read-only Modbus RTU poller publishing to MQTT (HA discovery) and InfluxDB line protocol"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Safety rule: this crate must never be able to write to a Modbus device.
# Do not add a general Modbus client library here (they all ship write
# functions); the in-tree `rtu` module implements function code 3 only.
[dependencies]
registers.workspace = true

anyhow.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
lexopt.workspace = true
rumqttc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-serial.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
