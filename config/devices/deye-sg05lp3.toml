# Deye SUN-10K-SG05LP3-EU-SM2 hybrid inverter (low-voltage battery, 3 phase).
#
# u16 registers, 0-based addresses. 32-bit counters are LOW word first.
# Temperatures are (s16 - 1000) x 0.1 °C, i.e. scale 0.1, offset -100.
#
# The addresses come from the ha-solarman map for SUN-SG04LP3 (same protocol
# family). battery_soc was checked against the inverter display. The rest were
# enabled on 2026-10-27 after a live reading was consistent with itself and
# with the DTSU666: V x A matched W for the battery and PV1, the load phases
# summed to load_power, and grid voltages and the grid power sign matched the
# meter. Still unconfirmed: gen_power (nothing on the GEN port) and the
# inverter's own energy counters.
#
# Keys become MQTT unique_ids ("deye_<key>") and Domoticz database keys:
# never rename a key once it has been published. Energy/power pairs follow
# "<x>_energy" / "<x>_power"; per-phase keys start with the phase so they do
# not compete for Domoticz's kWh/W pairing.

[device]
id = "deye"
name = "Inverter Deye SUN-10K"
manufacturer = "Deye"
model = "SUN-10K-SG05LP3-EU-SM2"
word_order = "low_first"
blocks = [
    [514, 28], # 514..541: energy counters, temperatures
    [586, 6],  # 586..591: battery
    [598, 38], # 598..635: grid, inverter output
    [644, 10], # 644..653: load
    [661, 19], # 661..679: GEN port, PV
]

# ---- energy counters (u32 x0.1 kWh) -------------------------------------------

[[register]]
key = "battery_charge_energy"
name = "Battery charged energy"
address = 516
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

[[register]]
key = "battery_discharge_energy"
name = "Battery discharged energy"
address = 518
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

[[register]]
key = "grid_import_energy"
name = "Grid bought energy (inverter)"
address = 522
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

[[register]]
key = "grid_export_energy"
name = "Grid sold energy (inverter)"
address = 524
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

[[register]]
key = "load_energy"
name = "Load energy"
address = 527
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

# Resets at midnight, so it is a plain total, not total_increasing, and kept
# out of MQTT: Domoticz derives daily values from pv_energy itself.
[[register]]
key = "pv_today_energy"
name = "PV energy today"
address = 529
type = "u16"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total"
range = [0, 200]
verified = true
mqtt = false

[[register]]
key = "pv_energy"
name = "PV energy"
address = 534
type = "u32"
scale = 0.1
unit = "kWh"
device_class = "energy"
state_class = "total_increasing"
range = [0, 10000000]
verified = true

