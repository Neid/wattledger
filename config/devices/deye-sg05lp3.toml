# ---- derived --------------------------------------------------------------------------

[[derived]]
key = "pv_power"
name = "PV power"
op = "sum"
inputs = ["pv1_power", "pv2_power"]
unit = "W"
device_class = "power"
state_class = "measurement"

[[derived]]
key = "battery_charge_power"
name = "Battery charge power"
op = "negative_part"
inputs = ["battery_power"]
unit = "W"
device_class = "power"
state_class = "measurement"

[[derived]]
key = "battery_discharge_power"
name = "Battery discharge power"
op = "positive_part"
inputs = ["battery_power"]
unit = "W"
device_class = "power"
state_class = "measurement"

# Domoticz's Energy Dashboard expects battery power as + charge / - discharge.
[[derived]]
key = "battery_flow_power"
name = "Battery flow (+charge / -discharge)"
op = "negate"
inputs = ["battery_power"]
unit = "W"
device_class = "power"
state_class = "measurement"

[[derived]]
key = "grid_import_power"
name = "Grid import power (inverter)"
op = "positive_part"
inputs = ["grid_power"]
unit = "W"
device_class = "power"
state_class = "measurement"

[[derived]]
key = "grid_export_power"
name = "Grid export power (inverter)"
op = "negative_part"
inputs = ["grid_power"]
unit = "W"
device_class = "power"
state_class = "measurement"


# ---- settings (writable) ---------------------------------------------------
#
# Only registers listed here can ever be written, only within their range,
# and only when bridge.toml has [writes] mode = "on" (or "dry_run", which reads
# them but writes nothing). A setting with verified = false is refused in
# mode "on".
#
# Addresses come from the ha-solarman deye_p3 map. Verified on this inverter
# (2026-11-05) by reading them in dry_run mode and comparing with the display:
# max sell power 5 kW read 5000 and a 4 kW time-of-use slot 4000, so power
# registers are plain watts (not the x10 ha-solarman uses); work mode read 1,
# "Zero export to load".
#
# The export controller uses them like this (Deye's "forced discharge"):
# work mode "Selling first", solar sell on, time of use on for every day, and
# every time-of-use slot set to the export power, the stop SOC and no grid
# charging. When the export ends, every value is restored to what was read
# before the export started.

[[setting]]
key = "work_mode"
name = "Work mode (0 selling first, 1 zero export to load, 2 zero export to CT)"
address = 142
range = [0, 2]
verified = true

[[setting]]
key = "max_sell_power"
name = "Max sell power (System settings)"
address = 143
unit = "W"
range = [0, 10000]
verified = true

[[setting]]
key = "solar_sell"
name = "Solar sell (0 off, 1 on)"
address = 145
range = [0, 1]
verified = true

[[setting]]
key = "tou_selling"
name = "Time of use (bit 0 on, bits 1-7 Monday-Sunday)"
address = 146
range = [0, 255]
verified = true

# Slot start times, stored as HHMM (2200 = 22:00). A slot runs until the next
# slot's start; slot 6 runs until slot 1. Read for display only: an export
# never writes them, so they stay unverified and writes to them are refused.
