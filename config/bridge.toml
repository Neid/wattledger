# wattledger modbus-bridge configuration.
#
# Durations use humantime syntax: "500ms", "2s", "1m".
# Device map paths are relative to this file.

# One [[bus]] per serial adapter. Each bus is polled by its own task, so a
# failing adapter never delays the other one. Serial format is fixed at 8N1.

[[bus]]
name = "grid-meter"
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5ACC023644-if00"
baud = 9600
poll_interval = "2s"
request_timeout = "500ms"
inter_request_gap = "50ms"
reopen_after_timeouts = 5
devices = [
    { slave = 1, map = "devices/dtsu666.toml" },
]

[[bus]]
name = "inverter"
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5ACB127910-if00"
baud = 9600
poll_interval = "5s"
request_timeout = "500ms"
inter_request_gap = "50ms"
reopen_after_timeouts = 5
devices = [
    # mqtt_interval overrides mqtt.publish_interval for this device.
    { slave = 2, map = "devices/deye-sg05lp3.toml" },
]

[mqtt]
enabled = true
host = "127.0.0.1"
port = 1883
client_id = "wattledger-bridge"
# username = ""
# password = ""
topic_prefix = "wattledger"          # states: wattledger/<device>/<key>, LWT: wattledger/status
discovery_prefix = "homeassistant"
# Domoticz stores every update, so states are sent at most this often per
# device (latest value); the database sink below still gets every poll.
publish_interval = "10s"
# Unverified registers stay out of MQTT/Domoticz until their map entry says
# verified = true. Set this to announce them anyway.
publish_unverified = false

[influx]
enabled = true
# VictoriaMetrics accepts InfluxDB line protocol on /write.
# InfluxDB v1: http://host:8086/write?db=energy
# InfluxDB v2: http://host:8086/api/v2/write?org=home&bucket=energy (+ token)
url = "http://127.0.0.1:8428/write"
# token = ""
batch_interval = "10s"
request_timeout = "5s"
# One line per device poll (~2500 lines/h for both devices, ~0.5-1 kB each),
# so 10000 lines bridge a ~4 h database outage in under 10 MB.
buffer_lines = 10000
max_batch_lines = 5000
