# wattledger modbus-bridge configuration.
#
# Durations use humantime syntax: "500ms", "2s", "1m".
# Device map paths are relative to this file.

# One [[bus]] per serial adapter. Each bus is polled by its own task, so a
# failing adapter never delays the other one. Serial format is fixed at 8N1.
#
# usb_reset_after: when a bus gets no answer for this long, the bridge asks
# the root helper (deploy/wattledger-usb-reset) to switch the adapter's USB
# port off and on, like unplugging it. A hung USB-RS485 adapter stays on the
# USB bus but stops passing data; reopening the port does not fix that.
# Further resets back off (x2 each, up to 1 h) until the bus answers again.
# Leave it out to disable resets for a bus.

[[bus]]
name = "grid-meter"
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5ACC023644-if00"
baud = 9600
poll_interval = "2s"
request_timeout = "500ms"
inter_request_gap = "50ms"
reopen_after_timeouts = 5
usb_reset_after = "3m"
devices = [
    { slave = 1, map = "devices/dtsu666.toml" },
]

[[bus]]
name = "inverter"
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5ACB127910-if00"
baud = 9600
poll_interval = "5s"
# The Deye sometimes answers late: at 500ms ~10% of polls lost a block, at 1s ~3%.
request_timeout = "1s"
inter_request_gap = "50ms"
reopen_after_timeouts = 5
usb_reset_after = "3m"
devices = [
    # mqtt_interval overrides mqtt.publish_interval for this device.
    { slave = 2, map = "devices/deye-sg05lp3.toml" },
]

[mqtt]
enabled = true
host = "127.0.0.1"
port = 1883
client_id = "wattledger-bridge"
# username = ""
# password = ""
topic_prefix = "wattledger"          # states: wattledger/<device>/<key>, LWT: wattledger/status
discovery_prefix = "homeassistant"
# Domoticz stores every update, so states are sent at most this often per
# device (latest value); the database sink below still gets every poll.
publish_interval = "10s"
# Unverified registers stay out of MQTT/Domoticz until their map entry says
# verified = true. Set this to announce them anyway.
publish_unverified = false

# Domoticz's Energy Dashboard shows grid export only for a "P1 Smart Meter"
# device, which MQTT discovery cannot create. Create one by hand (Dummy
# hardware -> Create Virtual Sensors -> P1 Smart Meter) and put its idx here;
# the bridge then sends it the grid meter's import/export counters and power
# on domoticz/in, at the device's publish interval.
# Domoticz needs an "MQTT Client Gateway" hardware listening on domoticz/in
# for this; the "MQTT Auto Discovery" hardware ignores that topic.
[mqtt.domoticz_p1]
idx = 55                                 # "Grid" on the "Virtual" dummy hardware
device = "dtsu"
# import_energy = "grid_import_energy"   # defaults
# export_energy = "grid_export_energy"
# power = "grid_power"                   # + import / - export

[influx]
enabled = true
# VictoriaMetrics accepts InfluxDB line protocol on /write.
# InfluxDB v1: http://host:8086/write?db=energy
# InfluxDB v2: http://host:8086/api/v2/write?org=home&bucket=energy (+ token)
url = "http://127.0.0.1:8428/write"
# token = ""
batch_interval = "10s"
request_timeout = "5s"
# One line per device poll (~2500 lines/h for both devices, ~0.5-1 kB each),
# so 10000 lines bridge a ~4 h database outage in under 10 MB.
buffer_lines = 10000
max_batch_lines = 5000
